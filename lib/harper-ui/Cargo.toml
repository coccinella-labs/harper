[package]
name = "harper-ui"
version = "0.22.5"
edition = "2024"
rust-version = "1.85.0"
authors = ["Harper Contributors"]
license = "MIT OR Apache-2.0"
description = "UI components for Harper AI assistant"
repository = "https://github.com/coccinella-labs/harper"
homepage = "https://github.com/coccinella-labs/harper"

[lib]
name = "harper_ui"
path = "src/lib.rs"

[dependencies]
harper-core = { path = "../harper-core" }
arboard = "3.4.0"
colored = "3.0.0"
crossterm = "0.29.0"
dotenvy = "0.15"
keyring = "4.2"
ratatui = "0.30"
syntect = { version = "5.3", features = ["parsing", "html"] }
image = "0.25.6"
rustyline = "18.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync"] }
turul-mcp-client = "0.4.2"
uuid = { version = "1.17.0", features = ["v4"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.3.0"
keyring-core = { version = "1", features = ["sample"] }

[[bin]]
name = "harper"
path = "src/main.rs"

[[bin]]
name = "harper-batch"
path = "src/bin/batch.rs"
