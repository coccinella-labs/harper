[package]
name = "harper-sandbox"
version = "0.3.4"
edition = "2024"
rust-version = "1.85.0"
authors = ["Harper Contributors"]
license = "MIT OR Apache-2.0"
description = "Sandbox isolation for Harper command execution"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1.52", features = ["process", "rt", "time", "io-util", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5"

[features]
default = []
bwrap = []
sandbox_exec = []

[dev-dependencies]
tempfile = "3.10"

[[example]]
name = "sandbox_basic"
path = "examples/basic.rs"
