[package]
name = "harper-mcp-server"
version = "0.1.9"
edition = "2024"
rust-version = "1.85.0"
authors = ["Harper Contributors"]
license = "MIT OR Apache-2.0"
description = "Reference MCP server demonstrating the JSON-RPC surface Harper expects"
repository = "https://github.com/coccinella-labs/harper"
homepage = "https://github.com/coccinella-labs/harper"

[dependencies]
turul-mcp-json-rpc-server = "0.3.44"
tokio = { version = "^1.52", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
lazy_static = "1.5"
dashmap = "6.1"
