[package]
name = "harper-core"
version = "0.24.1"
edition = "2024"
rust-version = "1.85.0"
authors = ["Harper Contributors"]
license = "MIT OR Apache-2.0"
description = "Core logic for Harper AI assistant"
repository = "https://github.com/coccinella-labs/harper"
homepage = "https://github.com/coccinella-labs/harper"

[dependencies]
arboard = "3.4.0"
axum = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
coccinella-agent-sdk = { git = "https://github.com/coccinella-labs/agent-sdk", rev = "8df2ba094c83c9f7da5b4caa2592e48fc0890e3c" }
log = "0.4"
colored = "3.0.0"
config = "0.15.23"
dotenvy = "0.15"
dirs = "7.0"
turul-mcp-client = "0.4.2"
reqwest = { version = "0.12.20", features = ["json", "native-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "process", "signal", "time"] }
tower = "0.5"
futures-util = "0.3"
uuid = { version = "1.17.0", features = ["v4"] }
ring = "0.17.14"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
aes = "0.8"
cbc = "0.1"
ctr = "0.9"
hex-literal = "1.1.0"
rustyline = "18.0"
image = "0.25.6"
urlencoding = "2.1"
async-trait = "0.1"
ignore = "0.4"
tempfile = "3.10"
flate2 = "1.1"
tar = "0.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
harper-firmware = { path = "../harper-firmware" }
harper-sandbox = { path = "../harper-sandbox" }
syn = { version = "3.0", features = ["full", "visit"] }

# Dependency resolution
[dependencies.base64]
version = "0.23"
[dependencies.bitflags]
version = "2.0"
[dependencies.getrandom]
version = "0.4"
[dependencies.h2]
version = "0.4"
[dependencies.hashbrown]
version = "0.17"
[dependencies.hashlink]
version = "0.12"
[dependencies.http]
version = "1.0"
[dependencies.http-body]
version = "1.0"
[dependencies.hyper]
version = "1.10"
[dependencies.socket2]
version = "0.6"
[dependencies.sync_wrapper]
version = "1.0"
[dependencies.thiserror]
version = "2.0"
[dependencies.thiserror-impl]
version = "2.0"
[dependencies.windows-sys]
version = "0.61"
[dependencies.windows-targets]
version = "0.53"

[dev-dependencies]
criterion = "0.5"

[features]
default = []
integration = []
