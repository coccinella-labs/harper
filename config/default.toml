[api]
provider = "OpenAI"
api_key = "your_api_key_here"
base_url = "https://api.openai.com/v1/chat/completions"
model_name = "gpt-5.5"
# To run fully offline with Ollama:
# provider = "Ollama"
# api_key = ""
# base_url = "http://localhost:11434/api/chat"
# model_name = "llama3"

[auth]
enabled = false

[auth.supabase]
# Keep real Supabase values in `.env`, not in tracked config files.
# Supported env vars:
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_JWT_SECRET
# SUPABASE_REDIRECT_URL
# SUPABASE_ALLOWED_PROVIDERS
# project_url = "https://your-project-id.supabase.co"
# anon_key = "your-supabase-publishable-key"
# jwt_secret = "your-supabase-jwt-secret"
# redirect_url = "http://127.0.0.1:8081/auth/callback"
# allowed_providers = ["github", "google", "apple"]

[database]
path = ".harper/sessions.db"

[mcp]
enabled = false
server_url = "http://localhost:5001"

[prompts]
system_prompt_id = "default"

[ui]
theme = "minimal"
show_menu_logo = true
mouse_capture = false

[tools]
# enabled_tools = ["read_file", "write_file", "run_command"]
# disabled_tools = []

[exec_policy]
# approval_profile = "allow_listed"   # strict | allow_listed | allow_all
# allowed_commands = ["ls", "cat", "grep"]
# blocked_commands = []
# sandbox_profile = "disabled"        # disabled | workspace | networked_workspace

[custom_commands]
# commands = { "hello" = "Say hello to the user", "status" = "Show system status" }

[firmware]
enabled = true

# [[firmware.devices]]
# name = "my-esp32"
# platform = "esp32"
# port = "/dev/ttyUSB0"

# [[firmware.devices]]
# name = "my-stm32"
# platform = "stm32"
# port = "/dev/ttyUSB1"

[exec_policy.sandbox]
# enabled = false
# allowed_dirs = []
# writable_dirs = []
# network_access = false
# readonly_home = true
# max_execution_time_secs = 30

[server]
enabled = true
host = "127.0.0.1"
port = 8081
