[workspace]
members = ["lib/harper-core", "lib/harper-ui", "lib/harper-mcp-server", "lib/harper-firmware", "lib/harper-sandbox"]
resolver = "3"

[package]
name = "harper-workspace"
version = "0.25.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["Harper Contributors"]
license = "MIT OR Apache-2.0"
description = "Harper AI assistant"
repository = "https://github.com/coccinella-labs/harper"
homepage = "https://github.com/coccinella-labs/harper"

[lib]
name = "harper_workspace"
path = "src/lib.rs"

[dependencies]
harper-core = { path = "lib/harper-core" }
harper-ui = { path = "lib/harper-ui" }
harper-firmware = { path = "lib/harper-firmware" }
harper-sandbox = { path = "lib/harper-sandbox" }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.3.0"
lazy_static = "1.4"
regex = "1.10"
criterion = "0.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rand = "0.10.1"
ratatui = "0.30"
syntect = { version = "5.3", features = ["parsing", "html"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
wait-timeout = "0.2"
num_cpus = "1.16"
serde_json = "1.0.140"

# The profile that 'dist' will build with
[lints.clippy]
pedantic = "warn"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
