name: Rulesets

on:
  push:
    branches: [main]
    paths:
      - .github/rulesets/*.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    name: Rulesets
    runs-on: ubuntu-latest
    if: github.repository_owner == 'coccinella-labs'
    steps:
      - uses: actions/checkout@v6

      - name: Apply main-protection ruleset
        run: |
          RULESET_ID=26004025
          gh api repos/${{ github.repository }}/rulesets/$RULESET_ID \
            --method PUT \
            --header "Accept: application/vnd.github+json" \
            --input .github/rulesets/main-protection.json
        env:
          GITHUB_TOKEN: ${{ secrets.BYPASS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Apply main-merge-queue ruleset
        run: |
          RULESET_ID=26003783
          gh api repos/${{ github.repository }}/rulesets/$RULESET_ID \
            --method PUT \
            --header "Accept: application/vnd.github+json" \
            --input .github/rulesets/main-merge-queue.json
        env:
          GITHUB_TOKEN: ${{ secrets.BYPASS_TOKEN || secrets.GITHUB_TOKEN }}
