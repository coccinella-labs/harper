name: Lockfiles

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday
  workflow_dispatch:

# Scheduled and manually dispatched runs only. Do not reintroduce a push trigger
# on cargo-lock-update: create-pull-request bases the PR on the checked-out
# branch by default, so such runs resolve base and head to the same branch and
# abort. Omitting the self-trigger also avoids racing the fixed bot branch.
concurrency:
  group: lockfiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-lockfile:
    name: Lockfiles
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: app-token
        name: Create Harper app token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HARPER_APP_ID }}
          private-key: ${{ secrets.HARPER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0

      - name: Clear stale Bazel cache
        run: |
          bazel shutdown 2>/dev/null || true
          rm -rf /home/runner/.cache/bazel /home/runner/.cache/bazelisk /home/runner/.bazel /home/runner/.bazelrc
          rm -rf /home/runner/.cache/bazel-external /home/runner/.bazel/external
          rm -rf /tmp/*bazel* 2>/dev/null || true

      - name: Update Cargo.lock
        run: cargo update

      - name: Update cargo-bazel-lock.json
        run: |
          set -euo pipefail
          rm -f cargo-bazel-lock.json
          CARGO_BAZEL_REPIN=true bazel build :harper_bin 2>/dev/null || true

      - name: Unit-test the summary generator
        run: python3 scripts/test_lockfile_summary.py

      - name: Summarize lockfile changes
        id: summary
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
          BASE="origin/${{ github.event.repository.default_branch }}"
          # Keep generated commentary outside the repository checkout so the PR
          # step cannot commit it.
          python3 scripts/lockfile_summary.py \
            --base-ref "$BASE" \
            --output "$RUNNER_TEMP/lockfile-summary.md"
          {
            echo "title<<TITLEEOF"
            echo "[chore] update rust lockfiles"
            echo "TITLEEOF"
            echo "body<<BODYEOF"
            cat <<'BODY'
          ## Summary

          Automated lockfile refresh. Generated facts are in the pinned comment below; this description is maintained by hand.
          BODY
            echo "BODYEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create PR
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: update rust lockfiles"
          title: ${{ steps.summary.outputs.title }}
          body: ${{ steps.summary.outputs.body }}
          branch: cargo-lock-update
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          add-paths: |
            Cargo.lock
            cargo-bazel-lock.json
            MODULE.bazel.lock

      # The generated facts live in a pinned comment rather than the PR body.
      # create-pull-request rewrites title and body on every run
      # (github-helper.ts createOrUpdate calls pulls.update unconditionally), so
      # a generated body would overwrite hand-written review notes on the next
      # scheduled run. Updating a comment keeps the two surfaces separate.
      - name: Update generated summary comment
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          SUMMARY_FILE: ${{ runner.temp }}/lockfile-summary.md
          MARKER: "<!-- lockfile-summary -->"
        run: |
          set -euo pipefail
          {
            echo "$MARKER"
            echo ""
            cat "$SUMMARY_FILE"
          } > summary-comment.md

          # `jq -s` merges every page into one array so jq can pick the first
          # match itself. (`gh api --slurp` cannot combine with `--jq` on the
          # installed CLI.) Piping into `head -n 1` instead would close the
          # pipe early, and under `set -o pipefail` the resulting SIGPIPE
          # fails the step, which would post a duplicate comment on every run.
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --paginate \
            | jq -s 'add | map(select(.body | startswith(env.MARKER))) | first | .id // empty')

          if [ -n "$existing" ]; then
            gh api --method PATCH \
              "repos/${{ github.repository }}/issues/comments/$existing" \
              -F body=@summary-comment.md >/dev/null
            echo "Updated comment $existing"
          else
            gh api --method POST \
              "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
              -F body=@summary-comment.md >/dev/null
            echo "Created summary comment"
          fi
