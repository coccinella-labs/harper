name: CLA

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    if: github.repository_owner == 'coccinella-labs'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - id: cla-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HARPER_APP_ID }}
          private-key: ${{ secrets.HARPER_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            signed.json

      - name: Checkout private cla-bot
        uses: actions/checkout@v4
        with:
          repository: coccinella-labs/clabot
          token: ${{ secrets.CLA_BOT_TOKEN }}
          path: cla-bot

      - name: Copy signed.json to cla-signers.json
        run: |
          cp signed.json cla-signers.json
          cp signed.json cla-bot/cla-signers.json

      - name: Run CLA bot
        uses: ./cla-bot/
        with:
          github-token: ${{ steps.cla-app-token.outputs.token }}
