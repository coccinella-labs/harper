name: Proof

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  proof:
    name: Proof
    runs-on: ubuntu-latest
    if: >-
      github.repository_owner == 'coccinella-labs' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - id: app-token
        name: Create Harper app token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HARPER_APP_ID }}
          private-key: ${{ secrets.HARPER_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - uses: coccinella-labs/proof@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          # The action defaults to a 400-word ceiling, which is not enough for
          # dependency PRs: those carry per-crate MSRV evidence and Bazel drift
          # detail that reviewers need. Raise the ceiling rather than strip
          # the evidence out of the description.
          max-words: "900"
