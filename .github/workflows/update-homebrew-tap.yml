# SPDX-License-Identifier: MIT OR Apache-2.0
name: Homebrew

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Installable Harper release tag (e.g. harper-workspace-0.25.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-homebrew-tap:
    name: Homebrew
    runs-on: ubuntu-latest
    env:
      TAP_REPO: coccinella-labs/homebrew-tap
      FORMULA_PATH: Formula/harper-ai.rb
    steps:
      - name: Checkout Harper
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            release_tag="${{ github.event.inputs.release_tag }}"
          else
            release_tag="${{ github.event.release.tag_name }}"
          fi
          case "$release_tag" in
            harper-*|harper-workspace-*) ;;
            *)
              echo "release_tag must start with harper- or harper-workspace-"
              exit 1
              ;;
          esac
          echo "release_tag=$release_tag" >> "$GITHUB_ENV"

      - name: Download release tarball and compute sha256
        id: tarball
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${RELEASE_TAG}"
          version="${release_tag#harper-}"
          case "$version" in
            workspace-*) version="${version#workspace-}" ;;
          esac
          tarball_url="https://github.com/coccinella-labs/harper/archive/refs/tags/${release_tag}.tar.gz"
          curl -L "$tarball_url" -o harper-release.tar.gz
          sha256=$(sha256sum harper-release.tar.gz | awk '{print $1}')
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Clone homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$TAP_REPO" homebrew-tap

      - name: Patch formula
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update-homebrew-tap.py \
            --release-tag "${RELEASE_TAG}" \
            --sha256 "${{ steps.tarball.outputs.sha256 }}" \
            --formula-path "homebrew-tap/$FORMULA_PATH"

      - name: Check for formula changes
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if git -C homebrew-tap diff --quiet -- "$FORMULA_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit formula update
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.tarball.outputs.version }}"
          branch="automation/homebrew-tap-${version}"
          git -C homebrew-tap checkout -B "$branch"
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add "$FORMULA_PATH"
          git -C homebrew-tap commit -m "build(tap): bump harper-ai ${version}"
          echo "branch=$branch" >> "$GITHUB_ENV"

      - name: Push tap branch
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git -C homebrew-tap push \
            --force-with-lease \
            "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" \
            "$branch"

      - name: Open tap PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.tarball.outputs.version }}"
          cat > pr-body.md <<EOF
          ## Changes
          - update \`harper-ai\` to \`${version}\`
          - point the formula at \`${RELEASE_TAG}\`
          - refresh the source tarball sha256

          ## Validation
          - downloaded the \`${RELEASE_TAG}\` source tarball
          - recomputed sha256 in workflow
          - patched \`Formula/harper-ai.rb\`
          EOF
          pr_url=$(gh pr list --repo "$TAP_REPO" --head "$branch" --json url --jq '.[0].url')
          if [ -n "$pr_url" ]; then
            gh pr edit "$pr_url" \
              --repo "$TAP_REPO" \
              --title "build(tap): bump harper-ai to ${version}" \
              --body-file pr-body.md
          else
            gh pr create \
              --repo "$TAP_REPO" \
              --head "$branch" \
              --base main \
              --title "build(tap): bump harper-ai to ${version}" \
              --body-file pr-body.md
          fi

      - name: Report no-op
        if: steps.diff.outputs.changed != 'true'
        shell: bash
        run: echo "Formula already matches ${RELEASE_TAG}"
