name: Lock PRs

on:
  pull_request:
    types: [closed]
  pull_request_target:
    types: [closed]

jobs:
  lock:
    name: Lock PR
    if: github.event.pull_request.merged == true && github.repository_owner == 'coccinella-labs'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - id: app-token
        name: Create Harper app token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HARPER_APP_ID }}
          private-key: ${{ secrets.HARPER_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Lock PR
        run: gh pr lock ${{ github.event.pull_request.number }} --repo ${{ github.repository }} || true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
