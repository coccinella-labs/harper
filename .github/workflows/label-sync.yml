name: Labels
on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  label-sync:
    name: Labels
    runs-on: ubuntu-latest
    if: github.repository_owner == 'coccinella-labs'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: app-token
        name: Create Harper app token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HARPER_APP_ID }}
          private-key: ${{ secrets.HARPER_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Sync Labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            // Simple YAML-like parser for labeler config
            const content = fs.readFileSync('config/labeler.yml', 'utf8');
            const labels = new Set();

            // Extract label names using regex
            const regex = /"([^"]+)":/g;
            let match;
            while ((match = regex.exec(content)) !== null) {
              labels.add(match[1]);
            }

            const labelColors = {
              'area:': '1d76db',
              'risk:': 'd93f0b',
              'needs-': 'fbca04'
            };

            const labelDescriptions = {
              'area: core': 'Changes to core functionality',
              'area: docs': 'Documentation changes',
              'area: mcp-server': 'MCP server changes',
              'area: ui': 'UI changes',
              'area: lib': 'Library changes',
              'area: testing': 'Test changes',
              'area: ci': 'CI/CD changes',
              'area: governance': 'Governance changes',
              'risk: high': 'High risk changes',
              'needs-design-review': 'Requires design review'
            };

            for (const labelName of labels) {
              const color = Object.entries(labelColors).find(([prefix, _]) => labelName.startsWith(prefix))?.[1] || 'ededed';
              const description = labelDescriptions[labelName] || labelName;

              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: color,
                  description: description
                });
                console.log(`Created label: ${labelName}`);
              } catch (e) {
                if (e.status === 422) {
                  console.log(`Label already exists: ${labelName}`);
                } else {
                  throw e;
                }
              }
            }
