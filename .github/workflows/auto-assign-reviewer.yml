name: Auto-Assign Reviewer

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'coccinella-labs'
    steps:
      - id: app-token
        name: Create Harper app token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HARPER_APP_ID }}
          private-key: ${{ secrets.HARPER_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Request a cross-review from the other org admin
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const reviewerMap = {
              'bniladridas': ['coccinella-admin'],
              'coccinella-admin': ['bniladridas'],
            };
            const reviewers = reviewerMap[author] || [];
            if (reviewers.length === 0) {
              core.info(`No reviewer mapping for ${author}`);
              return;
            }
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers,
            });
            core.info(`Assigned reviewers: ${reviewers.join(', ')}`);
