name: PR Title

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main

jobs:
  fix-pr-title:
    name: PR Title
    if: github.repository_owner == 'coccinella-labs' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - id: app-token
        name: Create Harper app token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HARPER_APP_ID }}
          private-key: ${{ secrets.HARPER_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - uses: coccinella-labs/title@v1
        with:
          token: ${{ steps.app-token.outputs.token }}
